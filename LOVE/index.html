<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, my biggest LOVE!</title>
    <link rel="icon" href="images/heart.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background-color: #f6cccc;
    background-image:
        linear-gradient(#d88b9a 3px, transparent 3px),
        linear-gradient(90deg, #d88b9a 3px, transparent 3px);
    background-size: 120px 120px;
}
.div1 {
    text-align: center;
}
h1 {
    color: #a71932;
    font-size: 48px;
    margin-bottom: 10px;
}
.code-box {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 15px;
}
.o {
    width: 70px;
    height: 70px;
    background: white;
    border: 3px solid #111;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    color: #a71932;
}
.hint {
    padding: 10px;
    color: #f6cccc;
    font-size: 22px;
    margin-bottom: 25px;
    background-color: #a71932;
    border-radius: 14px;
}
.password {
    width: 280px;
    padding: 20px;
    background: #fff;
    border: 4px solid #111;
    border-radius: 30px;
    margin: auto;
}
.keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    }
button {
    height: 65px;
    border: 3px solid #f46b8b;
    border-radius: 13px;
    background: #ec96a9;
    color: white;
    font-size: 35px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}
button:hover {
    transform: scale(1.05);
    background: #c9415d;
}
button:active {
    transform: scale(0.95);
}
.delete {
    font-size: 18px;
}
</style>
</head>
<body>
    <div class="div1">
        <h1>ENTER CODE</h1>
        <div class="code-box">
            <div class="o" id="o1">♡</div>
            <div class="o" id="o2">♡</div>
            <div class="o" id="o3">♡</div>
            <div class="o" id="o4">♡</div>
            <div class="o" id="o5">♡</div>
            <div class="o" id="o6">♡</div>
        </div>
        <h2 class="hint">
            день коли народилося моє чудо
        </h2>
        <div class="password">
            <div class="keys">
                <button onclick="addNumber('1')">1</button>
                <button onclick="addNumber('2')">2</button>
                <button onclick="addNumber('3')">3</button>
                <button onclick="addNumber('4')">4</button>
                <button onclick="addNumber('5')">5</button>
                <button onclick="addNumber('6')">6</button>
                <button onclick="addNumber('7')">7</button>
                <button onclick="addNumber('8')">8</button>
                <button onclick="addNumber('9')">9</button>
                <button onclick="addNumber('.')">.</button>
                <button onclick="addNumber('0')">0</button>
                <button class="delete" onclick="deleteNumber()">DEL</button>
            </div>
        </div>
    </div>
    <script>
        let code = "";
        const correctCode = "190909";
        function addNumber(number) {
            if (code.length < 6) {
                code += number;
                updateCode();
            }
            if (code.length === 6) {
                checkCode();
            }
        }
        function deleteNumber() {
            code = code.slice(0, -1);
            updateCode();
        }
        function updateCode() {
            for (let i = 1; i <= 6; i++) {
                const box = document.getElementById("o" + i);
                if (code[i - 1]) {
                    box.textContent = code[i - 1];
                } else {
                    box.textContent = "♡";
                }
            }
        }
        function checkCode() {
            if (code === correctCode) {
                window.location.href = "index1.html";
            } else {
                alert("Неправильно, чудо ти моє");
                code = "";
                updateCode();
            }
        }
    </script>
</body>
</html>
