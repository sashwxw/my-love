<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our photos</title>
    <link rel="icon" href="images/h.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #eee7dc;
            color: #3d3532;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }
        .album {
            min-height: 100vh;
            padding: 100px 5% 150px;
            position: relative;
            background:
                radial-gradient(
                    rgba(120, 90, 60, 0.08) 1px,
                    transparent 1px
                );
            background-size: 18px 18px;
        }
        h1 {
            text-align: center;
            font-size: clamp(40px, 8vw, 80px);
            font-weight: normal;
            font-style: italic;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 30px;
            color: #8c7770;
            margin-bottom: 120px;
        }
        .photos {
            position: relative;
            max-width: 1200px;
            min-height: 1900px;
            margin: auto;
        }
        .photo {
            position: absolute;
            width: 270px;
            padding: 8px;
            background: #fff;
            box-shadow:
                0 12px 30px rgba(50, 35, 25, 0.18);
            transition:
                transform 0.5s ease,
                box-shadow 0.5s ease;
            opacity: 0;
        }
        .photo img {
            width: 100%;
            display: block;
            object-fit: cover;
        }
        .frame-white {
            padding: 15px;
            background: white;
        }
        .frame-polaroid {
            padding: 12px;
            padding-bottom: 45px;
            background: #fffdf8;
        }
        .frame-polaroid p {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 15px;
            font-style: italic;
            color: #6d5c55;
        }
        .frame-dark {
            padding: 14px;
            background: #1b1716;
        }
        .frame-dark img {
            border: 1px solid #d6c5b8;
        }
        .photo1 {
            top: 0;
            left: 5%;
            transform: rotate(-8deg);
            animation: fromLeft 1s 0.2s forwards;
        }
        .photo2 {
            top: 80px;
            right: 5%;
            transform: rotate(7deg);
            animation: fromRight 1s 0.4s forwards;
        }
        .photo3 {
            top: 400px;
            left: 30%;
            transform: rotate(-4deg);
            width: 310px;
            animation: fromLeft 1s 0.6s forwards;
        }
        .photo4 {
            top: 550px;
            right: 7%;
            transform: rotate(11deg);
            animation: fromRight 1s 0.8s forwards;
        }
        .photo5 {
            top: 760px;
            left: 3%;
            transform: rotate(6deg);
            width: 300px;
            animation: fromLeft 1s 1s forwards;
        }
        .photo6 {
            top: 900px;
            right: 28%;
            transform: rotate(-9deg);
            animation: fromRight 1s 1.2s forwards;
        }
        .photo7 {
            top: 1150px;
            left: 18%;
            transform: rotate(8deg);
            animation: fromLeft 1s 1.4s forwards;
        }
        .photo8 {
            top: 1250px;
            right: 3%;
            width: 300px;
            transform: rotate(-6deg);
            animation: fromRight 1s 1.6s forwards;
        }
        .photo9 {
            top: 1500px;
            left: 42%;
            transform: rotate(5deg);
            animation: fromLeft 1s 1.8s forwards;
        }
        footer {
            position: fixed;
            bottom: 20px;
            left: 20px;
        }
        .back {
            background: none;
            border: none;
            color: #3d3532;
            font-family: Georgia, serif;
            font-size: 18px;
            cursor: pointer;
        }
        .back:hover {
            text-decoration: underline;
        }
        @keyframes fromLeft {
            0% {
                opacity: 0;
                transform:
                    translateX(-500px)
                    rotate(-25deg);
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes fromRight {
            0% {
                opacity: 0;
                transform:
                    translateX(500px)
                    rotate(25deg);
            }
            100% {
                opacity: 1;
            }
        }
        .end {
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            color: #796963;
            font-size: 18px;
        }
        .end span {
            display: block;
            font-size: 35px;
            color: #a56c6c;
            margin-top: 20px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
        @media (max-width: 700px) {
            .photo {
                position: relative;
                top: auto;
                left: auto;
                right: auto;

                margin: 40px auto;
            }

            .photos {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }  
    </style>
</head>
<body>
    <div class="album">
        <h1>Наша маленька збірка фоток</h1>
        <p class="subtitle">♡</p>
        <div class="photos">
            <div class="photo photo1">
                <img src="images/photo1.jpg">
            </div>
            <div class="photo photo2 frame-white">
                <img src="images/photo2.jpg">
            </div>
            <div class="photo photo3">
                <img src="images/photo3.jpg">
            </div>
            <div class="photo photo4 frame-polaroid">
                <img src="images/photo4.jpg">
                <p>який ти милий ♡</p>
            </div>
            <div class="photo photo5 frame-dark">
                <img src="images/photo5.jpg">
            </div>
            <div class="photo photo6">
                <img src="images/photo6.jpg">
            </div>
            <div class="photo photo7 frame-white">
                <img src="images/photo7.jpg">
            </div>
            <div class="photo photo8">
                <img src="images/photo8.jpg">
            </div>
            <div class="photo photo9 frame-polaroid">
                <img src="images/photo9.jpg">
                <p>♡</p>
            </div>
        </div>
        <div class="end">
            <p>і я сподіваюся, що вона ставатиме все більша...</p>
            <span>♥</span>
        </div>

    </div>
    <footer>
        <button class="back" id="back" onclick="window.location.href='index1.html'">&lt; back</button>
    </footer>
</body>
</html>
