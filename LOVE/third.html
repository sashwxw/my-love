<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HB</title>
    <link rel="icon" href="images/h.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;

            background:
                radial-gradient(circle at center, #0e0d0e 0%, #464683 45%, #0a090a 100%);

            position: relative;
        }

        /* =========================
           ЗАГАЛЬНИЙ КОНТЕНТ
        ========================= */

        .birthday {
            position: relative;
            z-index: 5;

            width: 100%;
            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           HAPPY BIRTHDAY
        ========================= */

        .title {
            font-size: clamp(50px, 10vw, 110px);
            line-height: 0.95;

            font-weight: bold;
            letter-spacing: 4px;

            color: #fff;

            text-shadow:
                0 0 5px #fff,
                0 0 10px #b8caff,
                0 0 20px #7a87f6,
                0 0 40px #4869d6;

            animation: neonPulse 2.5s infinite alternate;

            margin: 0;
        }

        .subtitle {
            margin-top: 15px;
            font-style: italic;
            font-size: 18px;
            letter-spacing: 3px;

            color: #fff;

            text-shadow:
                0 0 5px #fff,
                0 0 12px #7a87f6,
                0 0 25px #4869d6;
        }

        @keyframes neonPulse {
            from {
                text-shadow:
                    0 0 5px #fff,
                    0 0 10px #b8caff,
                    0 0 20px #7a87f6,
                    0 0 40px #4869d6;
            }
            to {
                text-shadow:
                    0 0 5px #fff,
                    0 0 15px #fff,
                    0 0 30px #7a87f6,
                    0 0 55px #4869d6;
            }
        }

        /* =========================
           ТОРТ
        ========================= */

        .cake-area {
            margin-top: 45px;

            width: 300px;
            height: 250px;

            position: relative;
        }

        .cake {
            position: absolute;

            bottom: 10px;
            left: 50%;

            transform: translateX(-50%);

            width: 240px;
            height: 150px;
        }

        /* нижній шар */

        .layer-bottom {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 240px;
            height: 75px;

            border-radius: 12px 12px 20px 20px;

            background: #dfc5a7;

            border: 3px solid #fff;

            box-shadow:
                0 0 5px #fff,
                0 0 15px #f2da9c,
                0 0 30px #dba95e;

            opacity: 0;

            animation: buildCake 0.8s forwards;
            animation-delay: 0.5s;
        }

        /* середній шар */

        .layer-middle {
            position: absolute;

            bottom: 55px;
            left: 25px;

            width: 190px;
            height: 60px;

            border-radius: 10px 10px 15px 15px;

            background: #b9c3eb;

            border: 3px solid #fff;

            box-shadow:
                0 0 5px #fff,
                0 0 15px #a6aaf4,
                0 0 25px #5c65dd;

            opacity: 0;

            animation: buildCake 0.8s forwards;
            animation-delay: 1.2s;
        }

        /* верхній шар */

        .layer-top {
            position: absolute;

            bottom: 100px;
            left: 55px;

            width: 130px;
            height: 50px;

            border-radius: 9px 9px 12px 12px;

            background: #f1c8f0;

            border: 3px solid #fff;

            box-shadow:
                0 0 5px #fff,
                0 0 15px #ffc4fa,
                0 0 30px #dd65e2;

            opacity: 0;

            animation: buildCake 0.8s forwards;
            animation-delay: 1.9s;
        }

        @keyframes buildCake {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           СВІЧКА
        ========================= */

        .candle {
            position: absolute;

            bottom: 145px;
            left: 50%;

            transform: translateX(-50%);

            width: 18px;
            height: 65px;

            border-radius: 5px;

            background: linear-gradient(
                90deg,
                #6b7add,
                #fff,
                #6b7add
            );

            border: 2px solid white;

            box-shadow:
                0 0 5px white,
                0 0 12px #9aa7ff,
                0 0 20px #5d71e0;

            opacity: 0;

            animation: candleAppear 0.7s forwards;
            animation-delay: 2.8s;
        }

        @keyframes candleAppear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* =========================
           ВОГНИК
        ========================= */

        .flame {
            position: absolute;

            left: 50%;
            top: -28px;

            transform: translateX(-50%);

            width: 18px;
            height: 28px;

            background: #fff;

            border-radius: 50% 50% 50% 50%;

            box-shadow:
                0 0 5px #fff,
                0 0 10px #ffe5a8,
                0 0 25px #ffb347,
                0 0 40px #ff8c42;

            cursor: pointer;

            animation:
                flameAppear 0.5s forwards 3.5s,
                flicker 0.15s infinite alternate;

            opacity: 0;
        }

        @keyframes flameAppear {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @keyframes flicker {
            from {
                transform: translateX(-50%) scale(1);
            }

            to {
                transform: translateX(-50%) scale(0.85, 1.1);
            }
        }
        
        /* =========================
           КУЛЬКИ
        ========================= */

        .balloon {
            position: absolute;

            width: 45px;
            height: 58px;

            border-radius: 50% 50% 45% 45%;

            opacity: 0.75;

            z-index: 1;

            animation: floatUp linear infinite;
        }

        .balloon::after {
            content: "";

            position: absolute;

            bottom: -35px;
            left: 50%;

            width: 1px;
            height: 35px;

            background: rgba(255,255,255,0.6);
        }

        .balloon::before {
            content: "";

            position: absolute;

            bottom: -5px;
            left: 50%;

            transform: translateX(-50%);

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: inherit;
        }

        .balloon1 {
            left: 8%;
            bottom: -100px;

            border: 3px solid #8c9fff;

            box-shadow:
                0 0 10px #8c9fff,
                0 0 25px #5d62e2;

            animation-duration: 12s;
        }

        .balloon2 {
            left: 23%;
            bottom: -150px;

            width: 35px;
            height: 48px;

            border: 3px solid #9ef7ff;

            box-shadow:
                0 0 10px #9ef7ff,
                0 0 25px #50cde0;

            animation-duration: 15s;
            animation-delay: 3s;
        }

        .balloon3 {
            right: 10%;
            bottom: -120px;

            border: 3px solid #ffe98a;

            box-shadow:
                0 0 10px #ffe98a,
                0 0 25px #e6c957;

            animation-duration: 13s;
            animation-delay: 1s;
        }

        .balloon4 {
            right: 25%;
            bottom: -180px;

            width: 38px;
            height: 50px;

            border: 3px solid #b99aff;

            box-shadow:
                0 0 10px #b99aff,
                0 0 25px #8d6be0;

            animation-duration: 17s;
            animation-delay: 5s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-55vh) rotate(8deg);
            }

            100% {
                transform: translateY(-120vh) rotate(-5deg);
            }
        }

        /* =========================
           BACK
        ========================= */

        footer {
            position: fixed;

            bottom: 20px;
            left: 20px;

            z-index: 10;
        }

        .back {
            background: none;
            border: none;

            color: #fff;

            font-family: Georgia, serif;
            font-size: 18px;

            cursor: pointer;

            text-shadow:
                0 0 5px #fff,
                0 0 12px #4560e8;
        }

        .back:hover {
            text-shadow:
                0 0 5px white,
                0 0 15px #8c9dff,
                0 0 25px #4560e8;
        }

        /* =========================
           ТЕЛЕФОН
        ========================= */

        @media (max-width: 600px) {

            .title {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 17px;
            }

            .cake-area {
                margin-top: 35px;
                transform: scale(0.8);
            }

            .balloon {
                transform: scale(0.8);
            }

            .balloon1 {
                left: 3%;
            }

            .balloon2 {
                left: 12%;
            }

            .balloon3 {
                right: 3%;
            }

            .balloon4 {
                right: 12%;
            }
        }
    </style>
</head>

<body>

    <!-- КУЛЬКИ -->

    <div class="balloon balloon1"></div>
    <div class="balloon balloon2"></div>
    <div class="balloon balloon3"></div>
    <div class="balloon balloon4"></div>


    <!-- ГОЛОВНИЙ КОНТЕНТ -->
    <main class="birthday">
        <h1 class="title">HAPPY<br>BIRTHDAY</h1>
        <div class="subtitle">for the love of my life </div>


        <!-- ТОРТ -->

        <div class="cake-area">

            <div class="cake">

                <div class="layer-bottom"></div>

                <div class="layer-middle"></div>

                <div class="layer-top"></div>

                <div class="cream"></div>

                <div class="cream-top"></div>

                <div class="candle">

                    <div
                        class="flame"
                        id="flame"
                        onclick="blowCandle(event)"
                    ></div>

                    <div
                        class="smoke"
                        id="smoke"
                    ></div>

                </div>

            </div>

        </div>

    </main>


    <!-- BACK -->

    <footer>
        <button
            class="back"
            onclick="window.location.href='index1.html'"
        >
            &lt; back
        </button>
    </footer>


    <script>

        function blowCandle(event) {

            // щоб натискання на вогник
            // не викликало інші елементи

            event.stopPropagation();

            const flame = document.getElementById("flame");
            const smoke = document.getElementById("smoke");

            flame.classList.add("off");

            setTimeout(() => {
                smoke.classList.add("show");
            }, 250);
        }

    </script>

</body>
</html>
